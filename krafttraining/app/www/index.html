<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krafttraining</title>
<script src="chart.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#16181d;--mut:#6b7280;--line:#e5e7eb;--acc:#2563eb;--acc2:#0d9488;--warn:#b45309;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--fg:#e8eaed;--mut:#9aa0aa;--line:#2a2f38;--acc:#60a5fa;--acc2:#2dd4bf;--warn:#f59e0b;--chip:#1e2533}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;max-width:960px;margin:auto}
h1{font-size:18px;margin:0}
nav{display:flex;gap:4px;padding:6px 12px 10px;max-width:960px;margin:auto;overflow-x:auto}
nav button{flex:0 0 auto;border:0;background:transparent;color:var(--mut);padding:7px 12px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--chip);color:var(--acc)}
main{max-width:960px;margin:auto;padding:14px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-size:22px;font-weight:700}
.kpi .l{color:var(--mut);font-size:12.5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row .t{font-weight:600}
.row .s{color:var(--mut);font-size:13px}
.right{text-align:right;white-space:nowrap}
.mut{color:var(--mut)}
.small{font-size:13px}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.btn{border:0;background:var(--acc);color:#fff;font:inherit;font-weight:600;padding:10px 14px;border-radius:10px;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--acc)}
.btn:disabled{opacity:.5}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600;border-top:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--acc);margin-right:4px}
.tag.W{color:var(--mut)}.tag.D{color:var(--warn)}.tag.F{color:#dc2626}
.chartbox{position:relative;height:220px}
.back{border:0;background:none;color:var(--acc);font:inherit;font-weight:600;padding:0 0 10px;cursor:pointer}
.note{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mut);font:inherit;font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg)}
.score{height:6px;border-radius:3px;background:var(--acc2);margin-top:4px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Krafttraining</h1><span id="status" class="mut small">Lädt …</span></div>
  <nav id="nav">
    <button data-v="overview" class="on">Übersicht</button>
    <button data-v="history">Verlauf</button>
    <button data-v="exercises">Übungen</button>
    <button data-v="watch">Uhr-Vorschläge</button>
    <button data-v="settings">Einstellungen</button>
  </nav>
</header>
<main id="main"></main>

<script>
const S = { db:null, workouts:[], exDocs:{}, view:"overview", detail:null, formula:"brzycki", loaded:false, error:null };
try { S.formula = localStorage.getItem("formula") || "brzycki"; } catch(e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtD = iso => new Date(iso).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtDs = iso => new Date(iso).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"});
const kg = v => (Math.round(v*10)/10).toLocaleString("de-DE") + " kg";
const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80) || "uebung";
const DAY = 864e5;

function e1rm(w, r){
  if (!w || !r || r < 1) return 0;
  if (r === 1) return w;
  if (S.formula === "epley") return w * (1 + r/30);
  if (r >= 37) return 0;
  return w * 36 / (37 - r);
}
const working = s => s.t !== "W";

// ---------- derived data ----------
function exerciseStats(){
  const m = {};
  const sorted = [...S.workouts].sort((a,b)=>a.date.localeCompare(b.date));
  for (const w of sorted) for (const e of w.ex||[]) {
    const x = m[e.n] ||= { name:e.n, sessions:[], best1rm:0, maxW:0, bestVol:0, last:null, rest:null };
    const ws = e.sets.filter(working);
    const s1 = Math.max(0, ...ws.map(s=>e1rm(s.w,s.r)));
    const mw = Math.max(0, ...ws.map(s=>s.w));
    const vol = ws.reduce((a,s)=>a+s.w*s.r,0);
    x.sessions.push({ date:w.date, wid:w.id, sets:e.sets, e1:s1, maxW:mw, vol, rest:e.rest });
    x.best1rm = Math.max(x.best1rm, s1); x.maxW = Math.max(x.maxW, mw); x.bestVol = Math.max(x.bestVol, vol);
    x.last = w.date; if (e.rest) x.rest = e.rest;
  }
  for (const id in S.exDocs) { const d = S.exDocs[id]; if (!m[d.name]) m[d.name] = { name:d.name, sessions:[], best1rm:0, maxW:0, bestVol:0, last:null, rest:d.rest||null, custom:true }; else { m[d.name].custom = !!d.custom; if (d.rest) m[d.name].restSetting = d.rest; } }
  return m;
}

// Vorschlagslogik, wie sie später auf der Uhr läuft (ohne KI, feste Regeln)
function suggestions(now = Date.now(), afterEx = null){
  const st = exerciseStats(); const out = [];
  // Übergänge: welche Übung folgt typischerweise auf welche
  const trans = {};
  for (const w of S.workouts) { const ex = w.ex||[]; for (let i=0;i<ex.length-1;i++){ const a=ex[i].n,b=ex[i+1].n; (trans[a] ||= {})[b] = ((trans[a]||{})[b]||0)+1; } }
  for (const x of Object.values(st)) {
    if (!x.sessions.length) { out.push({ name:x.name, score:0.05, why:"neu angelegt" }); continue; }
    let freq = 0;
    for (const s of x.sessions) { const age = (now - new Date(s.date))/DAY; if (age >= 0) freq += Math.exp(-age/28); }
    const since = (now - new Date(x.last))/DAY;
    const due = since < 1.5 ? 0.2 : since < 3 ? 0.7 : 1;
    let next = 0;
    if (afterEx && trans[afterEx]) { const tot = Object.values(trans[afterEx]).reduce((a,b)=>a+b,0); next = (trans[afterEx][x.name]||0)/tot; }
    const score = (freq * due) + next * 3;
    const why = [];
    why.push(`${x.sessions.filter(s=>(now-new Date(s.date))/DAY<=56).length}× in 8 Wochen`);
    why.push(`zuletzt vor ${Math.round(since)} T.`);
    if (next > 0) why.push(`folgt oft auf ${afterEx} (${Math.round(next*100)} %)`);
    out.push({ name:x.name, score, why: why.join(" · ") });
  }
  out.sort((a,b)=>b.score-a.score);
  return out;
}

// ---------- charts ----------
const charts = [];
function killCharts(){ while (charts.length) charts.pop().destroy(); }
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function lineChart(id, labels, data, label, color){
  if (!window.Chart) { const el=document.getElementById(id); if (el) el.parentElement.innerHTML='<p class="mut small">Diagramm-Bibliothek nicht geladen.</p>'; return; }
  const c = new Chart(document.getElementById(id), {
    type:"line",
    data:{ labels, datasets:[{ label, data, borderColor:color, backgroundColor:color, pointRadius:2.5, tension:.25, borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: t => `${label}: ${kg(t.parsed.y)}` } } },
      scales:{ x:{ ticks:{ color:css("--mut"), maxTicksLimit:6 }, grid:{display:false} }, y:{ ticks:{ color:css("--mut") }, grid:{ color:css("--line") } } } }
  });
  charts.push(c);
}
function barChart(id, labels, data, label, color){
  if (!window.Chart) return;
  charts.push(new Chart(document.getElementById(id), {
    type:"bar", data:{ labels, datasets:[{ label, data, backgroundColor:color, borderRadius:4 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} },
      scales:{ x:{ ticks:{ color:css("--mut"), maxTicksLimit:8 }, grid:{display:false} }, y:{ ticks:{ color:css("--mut"), precision:0 }, grid:{ color:css("--line") } } } }
  }));
}

// ---------- views ----------
function render(){
  killCharts();
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===S.view));
  const M = $("#main");
  if (S.error) { M.innerHTML = `<div class="card">${esc(S.error)}</div>`; return; }
  if (!S.loaded) { M.innerHTML = `<div class="card mut">Daten werden geladen …</div>`; return; }
  if (!S.workouts.length && S.view !== "settings") {
    M.innerHTML = `<div class="card"><h2>Noch keine Trainings</h2><p class="mut">Importiere deinen Strong-Export unter „Einstellungen".</p></div>`; return;
  }
  ({ overview, history, exercises, watch, settings })[S.view]();
}

function overview(){
  const ws = S.workouts; const now = Date.now();
  const year = new Date().getFullYear();
  const thisYear = ws.filter(w=>new Date(w.date).getFullYear()===year).length;
  const last30 = ws.filter(w=>now-new Date(w.date)<=30*DAY).length;
  const totalVol = ws.reduce((a,w)=>a+(w.ex||[]).reduce((b,e)=>b+e.sets.filter(working).reduce((c,s)=>c+s.w*s.r,0),0),0);
  const durs = ws.map(w=>w.durMin).filter(m=>m>0 && m<=240); // offen gelassene Strong-Trainings (z. B. 432 h) nicht mitzählen
  const avgDur = durs.length ? Math.round(durs.reduce((a,m)=>a+m,0)/durs.length) : 0;
  // Trainings pro Monat, letzte 18 Monate
  const months = []; const d0 = new Date(); d0.setDate(1);
  for (let i=17;i>=0;i--){ const d=new Date(d0.getFullYear(), d0.getMonth()-i, 1); months.push({k:`${d.getFullYear()}-${d.getMonth()}`, l:d.toLocaleDateString("de-DE",{month:"short",year:"2-digit"}), n:0}); }
  for (const w of ws){ const d=new Date(w.date); const m=months.find(x=>x.k===`${d.getFullYear()}-${d.getMonth()}`); if (m) m.n++; }
  const st = Object.values(exerciseStats()).filter(x=>x.sessions.length).sort((a,b)=>b.sessions.length-a.sessions.length).slice(0,6);
  $("#main").innerHTML = `
  <div class="kpis">
    <div class="kpi"><div class="v">${ws.length}</div><div class="l">Trainings gesamt</div></div>
    <div class="kpi"><div class="v">${thisYear}</div><div class="l">Trainings ${year}</div></div>
    <div class="kpi"><div class="v">${last30}</div><div class="l">letzte 30 Tage</div></div>
    <div class="kpi"><div class="v">${Math.round(totalVol/1000).toLocaleString("de-DE")} t</div><div class="l">Volumen gesamt (ohne Aufwärmen)</div></div>
    <div class="kpi"><div class="v">${avgDur} min</div><div class="l">Ø Trainingsdauer</div></div>
  </div>
  <div class="card"><h2>Trainings pro Monat</h2><div class="chartbox"><canvas id="cM"></canvas></div></div>
  <div class="card"><h2>Häufigste Übungen</h2>${st.map(x=>`
    <div class="row" data-ex="${esc(x.name)}"><div><div class="t">${esc(x.name)}</div><div class="s">${x.sessions.length} Einheiten · zuletzt ${fmtD(x.last)}</div></div>
    <div class="right"><div class="t">${x.best1rm?kg(x.best1rm):"–"}</div><div class="s">bestes 1RM</div></div></div>`).join("")}</div>`;
  barChart("cM", months.map(m=>m.l), months.map(m=>m.n), "Trainings", css("--acc"));
}

function history(){
  const ws = [...S.workouts].sort((a,b)=>b.date.localeCompare(a.date));
  if (S.detail && S.detail.type === "w") {
    const w = S.workouts.find(x=>x.id===S.detail.id);
    if (w) {
      $("#main").innerHTML = `<button class="back" id="bk">‹ Verlauf</button>
      <div class="card"><h2>${esc(w.name)}</h2><div class="mut small">${new Date(w.date).toLocaleString("de-DE",{weekday:"long",day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"})} · ${w.durMin||"?"} min</div></div>
      ${(w.ex||[]).map(e=>`<div class="card"><h2 class="lnk" data-ex="${esc(e.n)}" style="cursor:pointer">${esc(e.n)}</h2>
        <table><tr><th>Satz</th><th>Gewicht</th><th>Wdh.</th><th class="right">1RM</th></tr>
        ${setRows(e.sets)}</table>${e.rest?`<div class="mut small" style="margin-top:6px">Pause: ${e.rest} s</div>`:""}</div>`).join("")}`;
      $("#bk").onclick = ()=>{ S.detail=null; render(); };
      return;
    }
  }
  $("#main").innerHTML = `<div class="card">${ws.map(w=>{
    const sets = (w.ex||[]).reduce((a,e)=>a+e.sets.filter(working).length,0);
    return `<div class="row" data-w="${w.id}"><div><div class="t">${esc(w.name)}</div><div class="s">${(w.ex||[]).map(e=>esc(e.n.replace(/ \(.*\)/,""))).join(", ")}</div></div>
    <div class="right"><div class="t">${fmtDs(w.date)}</div><div class="s">${sets} Sätze · ${w.durMin||"?"} min</div></div></div>`;}).join("")}</div>`;
}

function setRows(sets){
  let n = 0;
  return sets.map(s=>{
    const lbl = s.t==="W" ? `<span class="tag W">W</span>` : s.t==="D" ? `<span class="tag D">D</span>` : s.t==="F" ? `<span class="tag F">F</span>${++n}` : `${++n}`;
    const e = s.t!=="W" ? e1rm(s.w,s.r) : 0;
    return `<tr><td>${lbl}</td><td>${kg(s.w)}</td><td>${s.r}</td><td class="right mut">${e?kg(e):""}</td></tr>`;
  }).join("");
}

function exercises(){
  const st = exerciseStats();
  if (S.detail && S.detail.type === "e" && st[S.detail.name]) return exerciseDetail(st[S.detail.name]);
  const list = Object.values(st).sort((a,b)=>(b.last||"").localeCompare(a.last||""));
  $("#main").innerHTML = `<div class="card"><input id="q" placeholder="Übung suchen …" value="${esc(S.q||"")}"><div id="xl" style="margin-top:6px"></div></div>`;
  const draw = ()=>{
    const q = ($("#q").value||"").toLowerCase(); S.q = q;
    $("#xl").innerHTML = list.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`
      <div class="row" data-ex="${esc(x.name)}"><div><div class="t">${esc(x.name)} ${x.custom?'<span class="tag">eigene</span>':""}</div>
      <div class="s">${x.sessions.length} Einheiten${x.last?" · zuletzt "+fmtD(x.last):""}</div></div>
      <div class="right"><div class="t">${x.best1rm?kg(x.best1rm):"–"}</div><div class="s">1RM</div></div></div>`).join("") || `<p class="mut">Keine Treffer.</p>`;
  };
  $("#q").oninput = draw; draw();
}

function exerciseDetail(x){
  const ss = x.sessions;
  const lab = ss.map(s=>fmtDs(s.date));
  // Rekorde je Wiederholungszahl
  const repPR = {};
  for (const s of ss) for (const t of s.sets.filter(working)) if (t.r>=1 && t.r<=12 && (!repPR[t.r] || t.w>repPR[t.r].w)) repPR[t.r] = { w:t.w, date:s.date };
  const last = ss[ss.length-1];
  const restInfo = x.restSetting || x.rest;
  $("#main").innerHTML = `<button class="back" id="bk">‹ Übungen</button>
  <div class="card"><h2>${esc(x.name)}</h2><div class="mut small">${ss.length} Einheiten${x.last?" · zuletzt "+fmtD(x.last):""}${restInfo?` · Pause ${restInfo} s`:""}</div></div>
  ${ss.length?`
  <div class="kpis">
    <div class="kpi"><div class="v">${kg(x.best1rm)}</div><div class="l">bestes geschätztes 1RM</div></div>
    <div class="kpi"><div class="v">${kg(x.maxW)}</div><div class="l">höchstes Gewicht</div></div>
    <div class="kpi"><div class="v">${kg(x.bestVol)}</div><div class="l">bestes Einheitsvolumen</div></div>
  </div>
  <div class="card"><h2>Geschätztes 1RM pro Einheit</h2><div class="chartbox"><canvas id="c1"></canvas></div></div>
  <div class="grid2">
    <div class="card"><h2>Höchstes Gewicht</h2><div class="chartbox"><canvas id="c2"></canvas></div></div>
    <div class="card"><h2>Volumen pro Einheit</h2><div class="chartbox"><canvas id="c3"></canvas></div></div>
  </div>
  <div class="card"><h2>Rekorde nach Wiederholungen</h2><table><tr><th>Wdh.</th><th>Gewicht</th><th class="right">Datum</th></tr>
    ${Object.keys(repPR).sort((a,b)=>a-b).map(r=>`<tr><td>${r}</td><td>${kg(repPR[r].w)}</td><td class="right mut">${fmtD(repPR[r].date)}</td></tr>`).join("")}</table></div>
  <div class="card"><h2>Letzte Einheit (${fmtD(last.date)}) – so startet die Uhr beim nächsten Mal</h2><table><tr><th>Satz</th><th>Gewicht</th><th>Wdh.</th><th class="right">1RM</th></tr>${setRows(last.sets)}</table></div>
  <div class="card"><h2>Verlauf</h2>${[...ss].reverse().map(s=>`<div class="row" data-w="${s.wid}"><div><div class="t">${fmtD(s.date)}</div>
    <div class="s">${s.sets.filter(working).map(t=>`${t.t==="D"?"↓":""}${t.w}×${t.r}`).join("  ")}</div></div><div class="right"><div class="t">${s.e1?kg(s.e1):"–"}</div><div class="s">1RM</div></div></div>`).join("")}</div>`
  : `<div class="card mut">Noch keine Einheiten mit dieser Übung.</div>`}`;
  $("#bk").onclick = ()=>{ S.detail=null; render(); };
  if (ss.length){
    lineChart("c1", lab, ss.map(s=>Math.round(s.e1*10)/10), "1RM", css("--acc"));
    lineChart("c2", lab, ss.map(s=>s.maxW), "Gewicht", css("--acc2"));
    lineChart("c3", lab, ss.map(s=>Math.round(s.vol)), "Volumen", css("--warn"));
  }
}

function watch(){
  const st = exerciseStats(); const names = Object.keys(st).sort();
  const after = S.after || "";
  const sug = suggestions(Date.now(), after || null).slice(0,10);
  const max = sug[0]?.score || 1;
  $("#main").innerHTML = `
  <div class="note">So würde die Uhr dir die Übungen heute sortieren. Die Reihenfolge entsteht ohne KI aus festen Regeln: wie oft du die Übung in letzter Zeit gemacht hast, wie lange sie her ist (gestern trainiert = weiter unten) und was du nach der vorherigen Übung meistens machst.</div>
  <div class="card"><label for="af">Vorherige Übung im laufenden Training</label>
    <select id="af"><option value="">– Trainingsbeginn –</option>${names.map(n=>`<option ${n===after?"selected":""}>${esc(n)}</option>`).join("")}</select></div>
  <div class="card"><h2>Vorschläge</h2>${sug.map((s,i)=>`<div class="row" data-ex="${esc(s.name)}"><div style="flex:1"><div class="t">${i+1}. ${esc(s.name)}</div><div class="s">${esc(s.why)}</div>
    <div class="score" style="width:${Math.max(4,Math.round(s.score/max*100))}%"></div></div></div>`).join("")}</div>`;
  $("#af").onchange = e => { S.after = e.target.value; render(); };
}

function settings(){
  const custom = Object.entries(S.exDocs).filter(([,d])=>d.custom);
  $("#main").innerHTML = `
  <div class="card"><h2>1RM-Formel</h2>
    <div class="seg" id="fm"><button data-f="brzycki">Brzycki</button><button data-f="epley">Epley</button></div>
    <p class="mut small">Brzycki: Gewicht × 36 / (37 − Wdh.). Epley: Gewicht × (1 + Wdh./30). Aufwärmsätze werden nicht mitgerechnet.</p></div>
  <div class="card"><h2>Neue Übung anlegen</h2>
    <label for="nn">Name</label><input id="nn" placeholder="z. B. Hip Thrust (Machine)">
    <div class="grid2"><div><label for="nk">Kategorie</label><select id="nk"><option>Langhantel</option><option>Kurzhantel</option><option>Maschine</option><option>Kabel</option><option>Körpergewicht</option><option>Sonstige</option></select></div>
    <div><label for="nr">Standard-Pause (Sekunden)</label><input id="nr" type="number" min="0" step="15" value="90"></div></div>
    <div style="margin-top:12px"><button class="btn" id="nadd">Anlegen</button> <span id="nmsg" class="mut small"></span></div>
    ${custom.length?`<div style="margin-top:12px">${custom.map(([id,d])=>`<div class="row" style="cursor:default"><div><div class="t">${esc(d.name)}</div><div class="s">${esc(d.cat||"")} · Pause ${d.rest||"–"} s</div></div><button class="btn sec" data-del="${id}">Löschen</button></div>`).join("")}</div>`:""}
  </div>
  <div class="card"><h2>Strong-Export importieren</h2>
    <p class="mut small">CSV aus Strong (Einstellungen → Export Workouts). Bereits vorhandene Trainings werden übersprungen.</p>
    <input type="file" id="csv" accept=".csv,text/csv"><div id="imsg" class="mut small" style="margin-top:8px">${esc(S.imsg||"")}</div></div>`;
  document.querySelectorAll("#fm button").forEach(b=>{ b.classList.toggle("on", b.dataset.f===S.formula); b.onclick=()=>{ S.formula=b.dataset.f; try{localStorage.setItem("formula",S.formula)}catch(e){} render(); }; });
  $("#nadd").onclick = addExercise;
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await S.db.collection("exercises").doc(b.dataset.del).delete(); }catch(e){ b.disabled=false; } });
  $("#csv").onchange = importCsv;
}

async function addExercise(){
  const name = $("#nn").value.trim(); const msg = $("#nmsg");
  if (!name) { msg.textContent = "Bitte einen Namen eingeben."; return; }
  if (exerciseStats()[name]) { msg.textContent = "Diese Übung gibt es schon."; return; }
  if (!S.db) { msg.textContent = "Speichern ist gerade nicht möglich."; return; }
  $("#nadd").disabled = true;
  try { await S.db.collection("exercises").doc("x-"+slug(name)).set({ name, cat:$("#nk").value, rest:parseInt($("#nr").value)||null, custom:true, created:new Date().toISOString() }); msg.textContent = "Angelegt."; $("#nn").value=""; }
  catch(e){ msg.textContent = "Fehler: " + (e.message||e.code); }
  $("#nadd").disabled = false;
}

// ---------- CSV-Import (Strong, deutsch oder englisch) ----------
function parseCsv(text){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){ const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true; else if (c===','){ row.push(f); f=""; } else if (c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; } else if (c!=='\r') f+=c; }
  if (f||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function strongToWorkouts(text){
  const rows = parseCsv(text.replace(/^﻿/,"")); const h = rows.shift();
  const idx = (...names) => h.findIndex(x=>names.includes(x.trim()));
  const I = { d:idx("Datum","Date"), wn:idx("Workout-Name","Workout Name"), du:idx("Dauer","Duration"), ex:idx("Name der Übung","Exercise Name"), o:idx("Reihenfolge festlegen","Set Order"),
              w:idx("Gewicht","Weight"), r:idx("Wiederh.","Reps"), sec:idx("Sekunden","Seconds"), rpe:idx("RPE") };
  if (I.d<0 || I.ex<0 || I.w<0 || I.r<0) throw new Error("Unbekanntes Dateiformat.");
  const W = {};
  for (const r of rows){ if (!r[I.d]) continue;
    const id = "w-" + r[I.d].replace(/\D/g,"");
    const dm = String(r[I.du]||""); const mins = (parseInt((dm.match(/(\d+)h/)||[])[1]||0)*60) + parseInt((dm.match(/(\d+)\s*min/)||[])[1]||0);
    const w = W[id] ||= { id, date:r[I.d].replace(" ","T"), name:r[I.wn]||"Workout", durMin:mins, ex:[], src:"strong" };
    const n = r[I.ex]; let e = w.ex[w.ex.length-1];
    if (!e || e.n!==n){ e = { n, sets:[], _r:[] }; w.ex.push(e); }
    const o = (r[I.o]||"").trim();
    if (/^(Ruhezeit|Rest Timer)$/i.test(o)) { e._r.push(parseFloat(r[I.sec])||0); continue; }
    const s = { t: o==="W"?"W":o==="D"?"D":o==="F"?"F":"N", w: parseFloat(String(r[I.w]).replace(",","."))||0, r: Math.round(parseFloat(String(r[I.r]).replace(",","."))||0) };
    if (I.rpe>=0 && r[I.rpe]) s.rpe = parseFloat(r[I.rpe]);
    e.sets.push(s);
  }
  for (const w of Object.values(W)) for (const e of w.ex){ if (e._r.length){ const c={}; e._r.forEach(v=>c[v]=(c[v]||0)+1); e.rest = +Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]; } delete e._r; }
  return Object.values(W);
}
async function importCsv(ev){
  const file = ev.target.files[0]; const msg = { set textContent(t){ S.imsg = t; const el = $("#imsg"); if (el) el.textContent = t; } }; if (!file) return;
  if (!S.db) { msg.textContent = "Speichern ist gerade nicht möglich."; return; }
  try {
    const ws = strongToWorkouts(await file.text());
    const have = new Set(S.workouts.map(w=>w.id));
    const neu = ws.filter(w=>!have.has(w.id));
    msg.textContent = `${ws.length} Trainings gefunden, ${neu.length} neu. Speichere …`;
    let i=0;
    for (const w of neu){ const { id, ...body } = w; await S.db.collection("workouts").doc(id).set(body); i++; if (i%10===0) msg.textContent = `${i} / ${neu.length} gespeichert …`; }
    msg.textContent = `Fertig: ${neu.length} Trainings importiert.`;
  } catch(e){ msg.textContent = "Fehler: " + (e.message||e.code); }
}

// ---------- navigation ----------
document.getElementById("nav").onclick = e => { const v = e.target.dataset?.v; if (v){ S.view=v; S.detail=null; render(); window.scrollTo(0,0); } };
document.getElementById("main").addEventListener("click", e => {
  const ex = e.target.closest("[data-ex]"); const w = e.target.closest("[data-w]");
  if (w && !e.target.closest("[data-del]")) { S.view="history"; S.detail={type:"w", id:w.dataset.w}; render(); window.scrollTo(0,0); }
  else if (ex) { S.view="exercises"; S.detail={type:"e", name:ex.dataset.ex}; render(); window.scrollTo(0,0); }
});


// ---------- Speicher: eigener Server (NUC) oder claude.ai-Datenbank ----------
// Gleiche Schnittstelle wie window.claude db: collection(c).onSnapshot / doc(id).set / doc(id).delete
function localDb(){
  const subs = {}; let rev = -1;
  const api = (path, opt) => fetch("api/" + path, opt).then(r => { if (!r.ok) throw Object.assign(new Error("HTTP " + r.status), {code:r.status}); return r.json(); });
  async function pull(force){
    const st = await api("rev");
    if (!force && st.rev === rev) return; rev = st.rev;
    for (const [c, list] of Object.entries(subs)){
      const res = await api(c);
      const snap = { docs: res.docs.map(d => ({ id:d.id, data:()=>d.data })), metadata:{ fromCache:false } };
      list.forEach(s => s.cb(snap));
    }
  }
  const tick = () => pull(false).catch(e => Object.values(subs).flat().forEach(s => s.err && s.err(e)));
  setInterval(tick, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  return {
    collection(c){ return {
      onSnapshot(cb, err){ (subs[c] ||= []).push({cb, err}); pull(true).catch(e => err && err(e)); },
      doc(id){ const u = c + "/" + encodeURIComponent(id); return {
        set: async d => { await api(u, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(d)}); tick(); },
        delete: async () => { await api(u, {method:"DELETE"}); tick(); }
      }; }
    }; }
  };
}

// ---------- data ----------
render();
(async () => {
  const timer = setTimeout(()=>{ if (!S.loaded){ $("#status").textContent="Daten noch nicht erreichbar"; } }, 10000);
  let db = null;
  try { db = window.claude ? await window.claude.use("db") : localDb(); } catch(e) {}
  if (!db) { clearTimeout(timer); S.error = "Die Datenbank ist nicht erreichbar."; render(); $("#status").textContent=""; return; }
  S.db = db;
  let gotW = false;
  db.collection("workouts").onSnapshot(snap => {
    S.workouts = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    if (!snap.metadata.fromCache) { gotW = true; clearTimeout(timer); }
    S.loaded = true; $("#status").textContent = gotW ? `${S.workouts.length} Trainings` : "wird aktualisiert …";
    render();
  }, err => { clearTimeout(timer); S.loaded = true; S.error = "Daten konnten nicht geladen werden (" + err.code + ")."; render(); });
  db.collection("exercises").onSnapshot(snap => {
    S.exDocs = {}; snap.docs.forEach(d=>S.exDocs[d.id]=d.data()); if (S.loaded) render();
  }, () => {});
})();
</script>
